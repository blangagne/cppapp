<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101726"><title>Code & Jeux — C++</title><link rel="stylesheet" href="style.css"></head>
<body><div class="app">
<header class="top"><div class="brand"><span class="brandmark">{ }</span><div><strong>CODE & JEUX</strong><small>Ton entrainement C++</small></div></div><div class="stats"><span id="xp">0 XP</span><span id="done">0/306</span><button id="profileButton" class="profile-button" type="button">Profil</button></div></header>
<main class="layout"><aside class="sidebar"><div class="side-head"><span>PARCOURS</span><strong id="percent">0 %</strong></div><div class="meter"><span id="meter"></span></div><nav id="chapters" aria-label="Chapitres"></nav><div class="side-stats"><strong id="rank">Codeur du dimanche</strong><span id="mistakeTotal">0 erreurs</span><button id="achievementsButton" class="text-button" type="button">Voir mes succès</button></div><p class="save-note">Chaque profil garde sa progression sur cet appareil</p></aside>
<section class="work"><div class="chapter-kicker" id="chapterKicker"></div><section id="coursePanel" class="course-panel" aria-label="Mini cours du chapitre"><button id="courseToggle" class="course-toggle" type="button">Voir le cours</button><div id="courseContent"></div></section><div class="work-head"><div><span class="mission-label">À TOI DE JOUER</span><h1 id="title"></h1><p id="prompt"></p></div><span class="lesson-number" id="lessonNumber"></span></div><div id="toolbox" class="toolbox" aria-label="Boîte à outils"></div><div class="code-card"><div class="code-bar"><span class="lights"><i></i><i></i><i></i></span><span>main.cpp</span><span>C++</span></div><pre id="code" aria-label="Code à compléter"></pre></div><div class="answer-area"><div class="answer-row"><div id="answerFields" class="answer-fields"></div><button id="check">Vérifier <span>↵</span></button></div><p class="micro" id="answerHelp">Complète uniquement le blanc, pas toute la ligne</p><div id="feedback" class="feedback" aria-live="polite" hidden></div></div><div class="bottom"><div class="hint-actions"><button class="text-button" id="hint">Indice <span id="hintCount">1/2</span></button><button class="text-button" id="solution">Voir la réponse</button></div><div class="nav-actions"><button class="ghost" id="previous">Précédent</button><button class="ghost" id="next">Suivant <span>→</span></button></div></div><div id="hintBox" class="hint-box" hidden></div><section id="checkpoint" class="checkpoint" aria-label="Bilan du chapitre"></section></section></main>
</div><div id="profileOverlay" class="overlay" hidden><div class="overlay-card"><div class="overlay-head"><h2>Qui joue ?</h2><button id="closeProfiles" class="icon-button" type="button" aria-label="Fermer">×</button></div><div id="profileList" class="profiles"></div><form id="createProfile" class="create-profile"><label for="profileName">Nouveau profil</label><div><input id="profileName" maxlength="20" placeholder="Astrid, Bebou…" required><button type="submit">Créer</button></div><p id="profileError" role="alert"></p></form><p class="micro">Sans mot de passe · données sur cet appareil</p></div></div><div id="achievementOverlay" class="overlay" hidden><div class="overlay-card"><div class="overlay-head"><h2>Succès débloqués</h2><button id="closeAchievements" class="icon-button" type="button" aria-label="Fermer">×</button></div><div id="achievementList"></div></div></div><script src="exercises.js"></script><script src="advanced.js"></script><script src="expansion.js"></script><script src="courses.js"></script><script src="pedagogy.js"></script><script src="flow.js"></script><script src="bosses.js"></script><script src="app.js"></script></body></html>
